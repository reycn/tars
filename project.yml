name: Tars
options:
  bundleIdPrefix: com.rongxin
  deploymentTarget:
    iOS: '17.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Tars:
    type: application
    platform: iOS
    sources: [iOS]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Tars
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: Find your Mac and display its agent status on this screen.
        NSBonjourServices: [_tars._tcp]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rongxin.Tars
        CODE_SIGN_STYLE: Automatic
  TarsMac:
    type: application
    platform: macOS
    sources:
      - MacApp
      - Mac/Server.swift
      - Mac/EventSource.swift
      - path: Mac/hook.py
        buildPhase: resources
      - path: Mac/install-hooks.py
        buildPhase: resources
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleDisplayName: Tars
        LSUIElement: true
        NSLocalNetworkUsageDescription: Let phones on your network find this Mac's agent status.
        NSBonjourServices: [_tars._tcp]
    entitlements:
      path: MacApp/TarsMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rongxin.TarsMac
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: ''
